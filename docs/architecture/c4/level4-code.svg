<svg width="100%" viewBox="0 0 680 670" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img">
<title>C4 level 4: the console package's call flow</title>
<desc>WTO calls validate, then EncodeWPL, which calls codepage.AtoE to translate the message to EBCDIC. EncodeWPL's result is passed to issueWTO, which is platform-gated: on most platforms console_stub.go returns a typed unsupported-platform error, while on z/OS and s390x together console_zos.go would call svc.Call35, though that file is compiled by nothing today because no z/OS Go toolchain exists yet.</desc>
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="230" y="40" width="220" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">WTO(msg, opts)</text>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Entry point</text>
<line x1="340" y1="104" x2="340" y2="168" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>

<rect x="240" y="170" width="200" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">validate(msg)</text>
<text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Length, control chars</text>
<line x1="340" y1="234" x2="340" y2="298" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>
<text x="380" y="266" text-anchor="middle" font-size="12" fill="#73726c">if valid</text>

<rect x="220" y="300" width="240" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">EncodeWPL(msg, opts)</text>
<text x="340" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Length + flags + text</text>
<line x1="460" y1="332" x2="488" y2="332" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>
<text x="474" y="318" text-anchor="middle" font-size="12" fill="#73726c">via</text>
<rect x="490" y="300" width="160" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">codepage.AtoE</text>
<text x="570" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">UTF-8 to EBCDIC</text>

<line x1="340" y1="364" x2="340" y2="428" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>

<rect x="250" y="430" width="180" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">issueWTO(wpl)</text>
<text x="340" y="472" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Platform-gated</text>

<path d="M340 494 L340 520 L210 520 L210 558" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>
<text x="230" y="514" text-anchor="middle" font-size="12" fill="#73726c">most platforms</text>
<path d="M340 494 L340 540 L470 540 L470 558" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow4)"/>
<text x="470" y="534" text-anchor="middle" font-size="12" fill="#73726c">z/OS + s390x only</text>

<rect x="90" y="560" width="240" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="582" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">console_stub.go</text>
<text x="210" y="602" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Most platforms</text>

<rect x="360" y="560" width="220" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="582" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">console_zos.go</text>
<text x="470" y="602" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Compiled by nothing today</text>
</svg>
