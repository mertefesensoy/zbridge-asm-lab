<text x="168" y="480" font-size="12" fill="#444441">blocked on U3</text>
<rect x="290" y="470" width="12" height="12" rx="3" fill="#D3D1C7"/>
<text x="308" y="480" font-size="12" fill="#444441">not yet scoped</text>
<rect x="430" y="470" width="12" height="12" rx="3" fill="#AFA9EC"/>
<text x="448" y="480" font-size="12" fill="#444441">shared core</text>
</svg>
